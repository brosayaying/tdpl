<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Don't Panic Lab — kids' coding academy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="55%" stop-color="#071009"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4ade80" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#4ade80" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="880" cy="180" rx="420" ry="300" fill="url(#glow)"/>

  <!-- Terminal window -->
  <g>
    <rect x="72" y="96" width="1056" height="438" rx="6" fill="#0a0f0c" stroke="#1c2f24" stroke-width="2"/>
    <rect x="72" y="96" width="1056" height="46" rx="6" fill="#0e1511"/>
    <rect x="72" y="130" width="1056" height="12" fill="#0e1511"/>
    <line x1="72" y1="142" x2="1128" y2="142" stroke="#1c2f24" stroke-width="2"/>
    <circle cx="102" cy="119" r="7" fill="#f87171" fill-opacity="0.7"/>
    <circle cx="126" cy="119" r="7" fill="#fbbf24" fill-opacity="0.7"/>
    <circle cx="150" cy="119" r="7" fill="#4ade80" fill-opacity="0.7"/>
    <text x="176" y="125" font-family="'JetBrains Mono', monospace" font-size="17" fill="#6b8574">guest@dontpaniclab: ~/future</text>
  </g>

  <!-- Prompt line -->
  <text x="112" y="212" font-family="'JetBrains Mono', monospace" font-size="22" fill="#6b8574">guest@dontpaniclab:~$</text>
  <text x="404" y="212" font-family="'JetBrains Mono', monospace" font-size="22" fill="#4ade80">./start_adventure --age 6-13</text>
  <rect x="782" y="194" width="13" height="24" fill="#4ade80"/>

  <!-- Headline -->
  <text x="112" y="316" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="600" fill="#e8f3ec">Kids who code</text>
  <text x="112" y="400" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="600" fill="#4ade80">out-build</text>
  <text x="512" y="400" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="600" fill="#e8f3ec">the future.</text>

  <!-- Subhead -->
  <text x="112" y="456" font-family="'JetBrains Mono', monospace" font-size="21" fill="#9fb8a8">Scratch · Python · AI · Robotics — small classes, real projects.</text>

  <!-- Footer strip -->
  <line x1="112" y1="486" x2="1088" y2="486" stroke="#1c2f24" stroke-width="2"/>
  <text x="112" y="518" font-family="'JetBrains Mono', monospace" font-size="19" fill="#3a9660">thedontpaniclab.org</text>
  <text x="1088" y="518" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="19" fill="#fbbf24">Term 4 · enrol now</text>

  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
