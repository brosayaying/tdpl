<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title">
  <title id="title">Inside the lab</title>
  <rect width="1000" height="700" fill="#050807"/>
  <defs>
    <pattern id="agrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4ade80" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="url(#agrid)"/>
  <g stroke="#4ade80" stroke-width="3" fill="#0e1511">
    <rect x="140" y="180" width="300" height="200" rx="10"/>
    <rect x="560" y="180" width="300" height="200" rx="10"/>
  </g>
  <g font-family="monospace" fill="#7dffa8">
    <text x="170" y="230" font-size="20">&gt; curiosity.load()</text>
    <text x="170" y="270" font-size="20" fill="#9fb8a8">  status: engaged</text>
    <text x="590" y="230" font-size="20">&gt; panic.level</text>
    <text x="590" y="270" font-size="20" fill="#fbbf24">  0 — as expected</text>
  </g>
  <g stroke="#2e5240" stroke-width="3" fill="#0a0f0c">
    <rect x="200" y="470" width="600" height="26" rx="4"/>
    <rect x="240" y="496" width="20" height="110"/>
    <rect x="740" y="496" width="20" height="110"/>
  </g>
  <text x="40" y="660" font-family="monospace" font-size="18" fill="#6b8574">$ about</text>
</svg>
