<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title id="title">Python track artwork</title>
  <rect width="800" height="500" fill="#0a0f0c"/>
  <rect x="90" y="90" width="620" height="320" rx="8" fill="#0e1511" stroke="#2e5240" stroke-width="3"/>
  <g font-family="monospace" font-size="24" fill="#4ade80">
    <text x="130" y="160">def adventure(name):</text>
    <text x="160" y="210">print(f&quot;Hello, {name}!&quot;)</text>
    <text x="160" y="260">return &quot;🚀&quot;</text>
    <text x="130" y="330" fill="#fbbf24">adventure(&quot;future coder&quot;)</text>
  </g>
  <text x="40" y="462" font-family="monospace" font-size="18" fill="#6b8574">$ python3</text>
</svg>
