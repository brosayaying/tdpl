<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Kids at a lit-up workbench with robots</title>
  <desc id="desc">Silhouettes of children at a glowing workbench with small robots, rendered in green terminal style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0a0f0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4ade80" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- workbench -->
  <rect x="180" y="500" width="840" height="22" rx="4" fill="#0e1511" stroke="#2e5240" stroke-width="2"/>
  <rect x="220" y="522" width="24" height="170" fill="#0e1511" stroke="#1c2f24" stroke-width="2"/>
  <rect x="956" y="522" width="24" height="170" fill="#0e1511" stroke="#1c2f24" stroke-width="2"/>
  <rect x="180" y="500" width="840" height="6" fill="#4ade80" fill-opacity="0.35"/>

  <!-- kid silhouettes -->
  <g fill="#0e1511" stroke="#4ade80" stroke-width="3">
    <circle cx="360" cy="400" r="42"/>
    <path d="M300 500 L320 445 Q360 425 400 445 L420 500 Z"/>
    <circle cx="600" cy="380" r="46"/>
    <path d="M536 500 L556 432 Q600 410 644 432 L664 500 Z"/>
    <circle cx="830" cy="405" r="40"/>
    <path d="M774 500 L792 450 Q830 432 868 450 L886 500 Z"/>
  </g>

  <!-- robots on bench -->
  <g stroke="#7dffa8" stroke-width="3" fill="#0a0f0c">
    <rect x="440" y="440" width="70" height="60" rx="6"/>
    <rect x="462" y="410" width="26" height="30" rx="4"/>
    <circle cx="458" cy="458" r="5" fill="#fbbf24" stroke="none"/>
    <circle cx="492" cy="458" r="5" fill="#fbbf24" stroke="none"/>
    <line x1="475" y1="440" x2="475" y2="400" />
    <circle cx="475" cy="396" r="5" fill="#4ade80" stroke="none"/>
    <rect x="680" y="448" width="60" height="52" rx="6"/>
    <circle cx="698" cy="468" r="5" fill="#4ade80" stroke="none"/>
    <circle cx="722" cy="468" r="5" fill="#4ade80" stroke="none"/>
    <line x1="680" y1="480" x2="656" y2="490"/>
    <line x1="740" y1="480" x2="764" y2="490"/>
  </g>

  <!-- laptop glow -->
  <g>
    <rect x="540" y="462" width="120" height="14" rx="3" fill="#1c2f24"/>
    <path d="M552 462 L552 412 L648 412 L648 462 Z" fill="#0a0f0c" stroke="#4ade80" stroke-width="2"/>
    <text x="560" y="440" font-family="monospace" font-size="13" fill="#4ade80">&gt; hello</text>
    <rect x="608" y="431" width="8" height="11" fill="#4ade80" opacity="0.85"/>
  </g>

  <!-- floating particles -->
  <g fill="#4ade80">
    <circle cx="250" cy="200" r="3" opacity="0.6"/>
    <circle cx="420" cy="140" r="2" opacity="0.4"/>
    <circle cx="760" cy="180" r="3" opacity="0.5"/>
    <circle cx="980" cy="240" r="2" opacity="0.5"/>
    <circle cx="1080" cy="140" r="3" opacity="0.35"/>
    <circle cx="140" cy="330" r="2" opacity="0.4"/>
  </g>

  <!-- caption -->
  <text x="40" y="752" font-family="monospace" font-size="22" fill="#6b8574">$ ./build_something --together</text>
</svg>
